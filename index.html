<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Binder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Study Binder">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --ink: #1B2430; --paper: #F5F6F1; --card: #FFFFFF; --border: #DDE0D6;
    --accent: #2F6F4F; --accent-soft: #E4EFE7; --gold: #C08A2E;
    --text: #23282F; --text-dim: #6B7280; --danger: #B5453A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; max-width: 100%;
    font-family: 'Public Sans', -apple-system, sans-serif; color: var(--text); background: var(--paper); }
  .serif { font-family: 'Fraunces', Georgia, serif; }
  #app { display: flex; min-height: 100vh; width: 100%; max-width: 100%; }

  .setup-wrap { max-width: 680px; margin: 0 auto; padding: 56px 24px; }
  .setup-wrap h1 { font-size: 28px; margin: 0 0 6px 0; }
  .setup-wrap p.lead { color: var(--text-dim); font-size: 15px; line-height: 1.55; }
  .setup-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; margin-bottom: 16px; }
  .setup-card h2 { font-size: 16px; margin: 0 0 10px 0; }
  .setup-error { background: #FBEAE8; border: 1px solid #E9BAB3; color: var(--danger); padding: 10px 14px; border-radius: 8px; font-size: 13.5px; margin-bottom: 14px; }
  .setup-wrap input[type=text], .setup-wrap input[type=email], .setup-wrap input[type=password] {
    width: 100%; font-size: 14px; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; background: #FCFCFA; margin-bottom: 0;
  }
  .setup-wrap input[type=text]:focus, .setup-wrap input[type=email]:focus, .setup-wrap input[type=password]:focus { outline: none; border-color: var(--accent); }
  .setup-card input + input { margin-top: 10px; }

  .btn { padding: 10px 18px; border-radius: 8px; font-size: 14.5px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 8px; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: #275C41; }
  .btn.text { background: none; color: var(--text-dim); }
  .btn.text:hover { color: var(--text); }
  .btn:disabled { opacity: 0.6; cursor: default; }

  .sidebar { width: 272px; flex-shrink: 0; background: var(--ink); color: #E8EAE3; display: flex; flex-direction: column; padding: 24px 18px; min-height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand-title { font-size: 20px; font-weight: 600; }
  .brand-sub { font-size: 12.5px; color: #9AA3AE; margin-bottom: 18px; }
  .close-btn { display: none; margin-left: auto; color: #B7C0C9; background: none; border: none; cursor: pointer; }

  .role-badge { font-size: 11px; padding: 4px 9px; border-radius: 20px; display: inline-block; margin-bottom: 14px; }
  .role-badge.admin { background: rgba(192,138,46,0.2); color: #F0D9A8; }
  .role-badge.viewer { background: rgba(255,255,255,0.08); color: #9AA3AE; }

  .search-wrap { position: relative; margin-bottom: 12px; }
  #searchInput { width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; color: #fff; padding: 9px 11px; font-size: 13.5px; font-family: inherit; }
  #searchInput::placeholder { color: #8B94A0; }
  #searchInput:focus { outline: none; border-color: var(--gold); }
  #searchDropdown { display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: #fff; color: var(--text); border-radius: 10px; box-shadow: 0 14px 30px rgba(0,0,0,0.28);
    max-height: 320px; overflow-y: auto; z-index: 30; padding: 6px 0; }
  #searchDropdown.open { display: block; }
  .search-group-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); padding: 8px 12px 4px; }
  .search-result-item { padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; }
  .search-result-item:hover { background: var(--accent-soft); }
  .search-result-item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .search-result-chapter { color: var(--text-dim); font-size: 12px; flex-shrink: 0; }
  .search-empty { padding: 10px 12px; font-size: 13px; color: var(--text-dim); }

  .nav-btn { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
    color: #E8EAE3; padding: 9px 10px; border-radius: 8px; font-size: 13.5px; cursor: pointer;
    margin-bottom: 10px; text-align: left; font-family: inherit; }
  .nav-btn:hover { background: rgba(255,255,255,0.12); }

  .chapter-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .chapter-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; border-left: 3px solid transparent; cursor: pointer; }
  .chapter-item[draggable="true"] { cursor: grab; }
  .chapter-item.drag-over { box-shadow: inset 0 2px 0 var(--gold); }
  .chapter-item:hover { background: rgba(255,255,255,0.05); }
  .chapter-item.active { background: rgba(255,255,255,0.08); border-left: 3px solid var(--gold); }
  .chapter-num { font-family: 'Fraunces', serif; font-size: 13px; color: #7C8794; width: 20px; flex-shrink: 0; }
  .chapter-title { font-size: 14.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chapter-actions { display: none; gap: 4px; }
  .chapter-item:hover .chapter-actions { display: flex; }
  .icon-btn { background: transparent; border: none; color: #B7C0C9; cursor: pointer; padding: 3px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
  .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
  .icon-btn.dim { color: #6B7280; }

  .rename-row { display: flex; gap: 6px; padding: 6px 4px; align-items: center; }
  .rename-row input { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff; padding: 6px 8px; font-size: 13.5px; }
  .inline-confirm { margin: 4px 0 8px 0; background: rgba(181,69,58,0.15); border: 1px solid rgba(181,69,58,0.4); padding: 10px; border-radius: 8px; font-size: 12.5px; }
  .inline-confirm p { margin: 0 0 8px 0; color: #E8AFA8; }
  .mini-row { display: flex; gap: 8px; }
  .mini-btn { flex: 1; padding: 7px 0; border-radius: 6px; font-size: 13px; border: none; cursor: pointer; font-weight: 600; }
  .mini-btn.primary { background: var(--gold); color: #1B2430; }
  .mini-btn.ghost { background: rgba(255,255,255,0.08); color: #E8EAE3; }
  .mini-btn.danger { background: #B5453A; color: #fff; }

  .add-chapter { margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 14px; }
  .add-btn { display: flex; align-items: center; gap: 8px; width: 100%; background: rgba(255,255,255,0.06); border: 1px dashed rgba(255,255,255,0.25); color: #E8EAE3; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
  .add-btn:hover { background: rgba(255,255,255,0.1); }
  .add-form { display: flex; flex-direction: column; gap: 8px; }
  .add-form input { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #fff; padding: 8px 10px; font-size: 13.5px; }

  .conn-status { font-size: 11.5px; color: #6D7684; margin-top: 12px; display: flex; align-items: center; gap: 6px; }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: #3E9C6E; flex-shrink: 0; }
  .sidebar-footer-link { font-size: 12px; color: #7C8794; background: none; border: none; cursor: pointer; text-align: left; padding: 4px 0; display: block; font-family: inherit; }
  .sidebar-footer-link:hover { color: #E8935B; }

  .main { flex: 1; min-width: 0; max-width: 100%; padding: 36px 44px; overflow-y: auto; overflow-x: hidden; }
  .mobile-bar { display: none; }
  .empty-state { min-height: 70vh; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; max-width: 620px; }
  .empty-state h2 { font-size: 26px; margin: 14px 0 8px 0; }
  .empty-state p { color: var(--text-dim); font-size: 15px; line-height: 1.55; margin: 0 0 18px 0; }

  .dashboard-stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0 22px 0; }
  .stat-tile { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; min-width: 92px; }
  .stat-tile strong { display: block; font-size: 21px; font-family: 'Fraunces', serif; }
  .stat-tile span { font-size: 12px; color: var(--text-dim); }
  .stat-tile.accent { border-color: var(--accent); background: var(--accent-soft); }

  .chapter-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; gap: 16px; }
  .chapter-header h1 { font-size: 30px; font-weight: 600; margin: 0; line-height: 1.2; overflow-wrap: anywhere; }
  .chapter-eyebrow { font-size: 13px; color: var(--text-dim); margin: 0 0 4px 0; }

  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 26px; flex-wrap: wrap; }
  .tab { display: flex; align-items: center; gap: 7px; padding: 10px 4px; margin-right: 26px; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-size: 14.5px; color: var(--text-dim); font-weight: 500; }
  .tab.active { color: var(--ink); border-bottom: 2px solid var(--accent); }

  .panel { display: none; max-width: 100%; }
  .panel.active { display: block; }
  .panel-empty { border: 1px dashed var(--border); border-radius: 12px; padding: 30px 26px; color: var(--text-dim); font-size: 14.5px; background: rgba(255,255,255,0.5); }
  .panel-empty strong { color: var(--text); display: block; margin-bottom: 4px; font-size: 15px; }

  .form-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 22px; max-width: 100%; }
  .form-grid { display: flex; flex-direction: column; gap: 10px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin-bottom: 5px; }
  .field input[type=text], .field input[type=email], .field input[type=password], .field textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; font-size: 14px; font-family: inherit; background: #FCFCFA; }
  .field textarea { resize: vertical; min-height: 64px; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .form-actions { display: flex; gap: 10px; margin-top: 4px; align-items: center; flex-wrap: wrap; }

  .file-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .file-choose-btn { border: 1px solid var(--border); background: #FCFCFA; padding: 8px 12px; border-radius: 8px; font-size: 13.5px; cursor: pointer; color: var(--text); }
  .file-chosen { font-size: 13px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; overflow-wrap: anywhere; }
  .file-chosen button { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 12px; }
  .uploading-note { font-size: 13px; color: var(--accent); margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .list { display: flex; flex-direction: column; gap: 12px; max-width: 100%; }
  .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px 17px; max-width: 100%; overflow: hidden; }
  .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .item-title { font-size: 15.5px; font-weight: 600; margin: 0 0 4px 0; overflow-wrap: anywhere; }
  .item-link { font-size: 13px; color: var(--accent); word-break: break-all; overflow-wrap: anywhere; text-decoration: none; }
  .item-link:hover { text-decoration: underline; }
  .item-desc { font-size: 14px; color: var(--text); margin: 6px 0 0 0; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .item-actions { display: flex; gap: 4px; flex-shrink: 0; }

  .file-row-view { margin-top: 10px; max-width: 100%; }
  .file-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-soft); padding: 7px 12px; border-radius: 8px; font-size: 13px; color: var(--accent); text-decoration: none; max-width: 100%; word-break: break-all; overflow-wrap: anywhere; }
  .file-chip:hover { text-decoration: underline; }
  .file-chip .fsize { color: #5C8E76; font-size: 12px; white-space: nowrap; }
  .preview-toggle { background: none; border: none; color: var(--accent); font-size: 12.5px; cursor: pointer; margin-left: 8px; text-decoration: underline; }
  .preview-box { margin-top: 10px; max-width: 100%; }
  .preview-box img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); display: block; user-select: none; }
  .preview-box iframe { width: 100%; height: 420px; border: 1px solid var(--border); border-radius: 8px; }
  .preview-box:fullscreen, .preview-box:-webkit-full-screen { background: #000; display: flex !important; align-items: center; justify-content: center; }
  .preview-box:fullscreen img, .preview-box:-webkit-full-screen img { max-width: 100vw; max-height: 100vh; border: none; border-radius: 0; object-fit: contain; }
  .preview-box:fullscreen iframe, .preview-box:-webkit-full-screen iframe { width: 100vw; height: 100vh; border: none; border-radius: 0; }
  .file-note { font-size: 12.5px; color: var(--text-dim); margin-top: 8px; }

  .answer-toggle { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--accent); background: var(--accent-soft); border: none; padding: 6px 10px; border-radius: 7px; cursor: pointer; font-weight: 600; }
  .answer-box { margin-top: 10px; background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
  .mastered-row { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 12.5px; color: var(--text-dim); }
  .mastered-row input { accent-color: var(--accent); }

  .loading { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 14px; padding: 30px 0; }

  .device-table { display: flex; flex-direction: column; gap: 10px; max-width: 720px; }
  .device-row { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .device-row.revoked { opacity: 0.6; border-color: var(--danger); }
  .device-name { font-weight: 600; font-size: 14.5px; }
  .device-meta { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
  .device-tag { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); margin-left: 8px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-card { background: var(--card); border-radius: 14px; padding: 26px; max-width: 380px; width: 100%; }
  .modal-card h2 { margin: 0 0 4px 0; font-size: 20px; }
  .modal-card p.hint { font-size: 13px; color: var(--text-dim); margin: 0 0 16px 0; }
  .modal-error { background: #FBEAE8; border: 1px solid #E9BAB3; color: var(--danger); padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }

  /* ================= app update notification ================= */
  .app-update-banner {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translate(-50%, 20px);
    width: min(92vw, 520px);
    background: var(--ink);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.25);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .app-update-banner.show {
    opacity: 1;
    transform: translate(-50%, 0);
    pointer-events: auto;
  }
  .app-update-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 19px;
  }
  .app-update-copy {
    flex: 1;
    min-width: 0;
  }
  .app-update-copy strong {
    display: block;
    font-size: 14px;
    margin-bottom: 3px;
  }
  .app-update-copy span {
    display: block;
    color: #C8CDD3;
    font-size: 12.5px;
    line-height: 1.4;
  }
  .app-update-actions {
    display: flex;
    gap: 7px;
    flex-shrink: 0;
  }
  .app-update-btn {
    border: none;
    border-radius: 8px;
    padding: 8px 11px;
    font: 600 12.5px inherit;
    cursor: pointer;
  }
  .app-update-btn.primary {
    background: var(--gold);
    color: var(--ink);
  }
  .app-update-btn.secondary {
    background: rgba(255,255,255,0.08);
    color: #E8EAE3;
  }
  @media (max-width: 520px) {
    .app-update-banner { bottom: 12px; padding: 12px; gap: 10px; }
    .app-update-icon { width: 34px; height: 34px; border-radius: 9px; }
    .app-update-actions { flex-direction: column; }
    .app-update-btn { padding: 7px 10px; }
  }

  @media (max-width: 780px) {
    .sidebar { position: fixed; z-index: 20; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: transform 0.2s ease; box-shadow: 4px 0 24px rgba(0,0,0,0.25); }
    .sidebar.open { transform: translateX(0); }
    .close-btn { display: flex; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 15; }
    .mobile-bar { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--paper); position: sticky; top: 0; z-index: 5; }
    .mobile-bar button { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; }
    .mobile-bar span { font-weight: 600; font-size: 15px; }
    .main { padding: 20px; }
    .chapter-header h1 { font-size: 24px; }
  }
</style>
</head>

</div>

<script>
/* ================= helpers ================= */
function esc(s){ if (s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatBytes(b){ if (b===undefined||b===null) return ''; if (b<1024) return b+' B'; if (b<1024*1024) return (b/1024).toFixed(1)+' KB'; return (b/(1024*1024)).toFixed(1)+' MB'; }
function newId(){ return (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2,10))); }
function fileExt(name){ return (name||'').split('.').pop().toLowerCase(); }
function isImageExt(ext){ return ['png','jpg','jpeg','gif','webp','svg'].includes(ext); }
function isPdfExt(ext){ return ext === 'pdf'; }
function timeAgo(iso){
  if (!iso) return '';
  const d = new Date(iso), diff = (Date.now()-d.getTime())/1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60)+'m ago';
  if (diff < 86400) return Math.floor(diff/3600)+'h ago';
  return Math.floor(diff/86400)+'d ago';
}
function guessDeviceLabel(){
  const ua = navigator.userAgent;
  let os = 'Unknown device';
  if (/ipad/i.test(ua)) os='iPad'; else if (/iphone/i.test(ua)) os='iPhone';
  else if (/android/i.test(ua)) os='Android'; else if (/mac os/i.test(ua)) os='Mac';
  else if (/windows/i.test(ua)) os='Windows'; else if (/linux/i.test(ua)) os='Linux';
  let browser='a browser';
  if (/edg\//i.test(ua)) browser='Edge'; else if (/chrome\//i.test(ua) && !/edg/i.test(ua)) browser='Chrome';
  else if (/firefox\//i.test(ua)) browser='Firefox'; else if (/safari\//i.test(ua) && !/chrome/i.test(ua)) browser='Safari';
  return `${browser} on ${os}`;
}
const BROWSER_ID_STORAGE_KEY = 'study-binder-browser-id';
function getBrowserId(){
  try {
    let id = localStorage.getItem(BROWSER_ID_STORAGE_KEY);
    if (!id) {
      id = newId();
      localStorage.setItem(BROWSER_ID_STORAGE_KEY, id);
    }
    return id;
  } catch (error) {
    return newId(); // Private/restricted storage cannot retain a browser block.
  }
}

/* ================= app update notification ================= */
let pendingServiceWorker = null;
let updateReloading = false;

function showAppUpdateBanner(worker) {
  pendingServiceWorker = worker || pendingServiceWorker;
  const banner = document.getElementById('appUpdateBanner');
  if (banner) banner.classList.add('show');
}

function hideAppUpdateBanner() {
  const banner = document.getElementById('appUpdateBanner');
  if (banner) banner.classList.remove('show');
}

async function applyAppUpdate() {
  const worker = pendingServiceWorker;
  if (!worker) return;

  updateReloading = true;
  worker.postMessage({ type: 'SKIP_WAITING' });
  hideAppUpdateBanner();
}

function setupAppUpdateNotifications(registration) {
  if (!registration) return;

  if (registration.waiting) {
    showAppUpdateBanner(registration.waiting);
  }

  registration.addEventListener('updatefound', () => {
    const newWorker = registration.installing;
    if (!newWorker) return;

    newWorker.addEventListener('statechange', () => {
      if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
        showAppUpdateBanner(newWorker);
      }
    });
  });

  // Ask the browser to check for a newer service worker when the app opens.
  registration.update().catch(() => {});
}

document.addEventListener('DOMContentLoaded', () => {
  const nowBtn = document.getElementById('appUpdateNow');
  const laterBtn = document.getElementById('appUpdateLater');

  if (nowBtn) nowBtn.addEventListener('click', applyAppUpdate);
  if (laterBtn) laterBtn.addEventListener('click', hideAppUpdateBanner);
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (updateReloading) window.location.reload();
  });
}

/* ================= passkey / fingerprint auth ================= */
function passkeySupported(){
  return !!(window.PublicKeyCredential && sbClient && sbClient.auth &&
    typeof sbClient.auth.registerPasskey === 'function' &&
    typeof sbClient.auth.signInWithPasskey === 'function');
}

async function enableFingerprint(){
  if (!isAdmin || !currentUser) {
    alert('Please sign in as admin first.');
    return;
  }

  if (!passkeySupported()) {
    alert('Fingerprint / passkey authentication is not supported by this browser or the Supabase client.');
    return;
  }

  try {
    const { data, error } = await sbClient.auth.registerPasskey();

    if (error) {
      console.error('Passkey registration error:', error);
      alert('Could not enable fingerprint / passkey login: ' + error.message);
      return;
    }

    alert('Fingerprint / passkey login is now enabled on this device.');
    renderSidebarShell();
  } catch (error) {
    console.error('Passkey registration failed:', error);
    alert('Fingerprint / passkey setup was cancelled or failed: ' + (error.message || error));
  }
}

async function adminPasskeyLogin(){
  if (!passkeySupported()) {
    renderLandingGate('Fingerprint / passkey authentication is not supported by this browser or device.');
    return;
  }

  try {
    const { data, error } = await sbClient.auth.signInWithPasskey();

    if (error) {
      console.error('Passkey sign-in error:', error);
      renderLandingGate('Fingerprint / passkey sign-in failed: ' + error.message);
      return;
    }

    if (!data || !data.user) {
      renderLandingGate('Fingerprint / passkey sign-in did not return an admin account.');
      return;
    }

    currentUser = data.user;
    isAdmin = currentUser.is_anonymous === false;

    if (!isAdmin) {
      await sbClient.auth.signOut();
      currentUser = null;
      isAdmin = false;
      renderLandingGate('The passkey is not linked to an admin account.');
      return;
    }

    await Promise.all([ registerDevice(guessDeviceLabel()), loadChapters() ]);
    renderShell();
  } catch (error) {
    console.error('Passkey sign-in failed:', error);
    renderLandingGate('Fingerprint / passkey sign-in was cancelled or failed: ' + (error.message || error));
  }
}

async function signOutCurrentUser(message){

  currentView = 'chapter';

    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const payload = JSON.parse(reader.result);
        const count = (payload.chapters||[]).length;
        if (!confirm(`This will add ${count} chapter(s) from the backup into your current binder (nothing existing gets deleted). Continue?`)) return;
        await importData(payload);
        await loadChapters();
        renderChapterList();
        alert('Import complete.');

    };
    reader.readAsText(file);
  }
});

/* ---- search ---- */
function chapterTitleOf(id){ const c = chapters.find(c=>c.id===id); return c ? c.title : ''; }
async function runGlobalSearch(term){
  const pattern = `%${term}%`;
  const [r, q, n] = await Promise.all([
    sbClient.from('resources').select('id,title,chapter_id').ilike('title', pattern).limit(6),
    sbClient.from('questions').select('id,question,chapter_id').ilike('question', pattern).limit(6),
    sbClient.from('notes').select('id,title,chapter_id').ilike('title', pattern).limit(6),
  ]);
  if (searchTerm.trim() !== term) return;
  renderSearchDropdown({ resources: r.data||[], questions: q.data||[], notes: n.data||[] });
}
function renderSearchDropdown(results){
  const el = document.getElementById('searchDropdown');
  if (!el) return;
  if (!results) { el.innerHTML = ''; el.classList.remove('open'); return; }
  const groups = [];
  if (results.resources.length) groups.push(['Resources', results.resources.map(r=>({label:r.title, chapterId:r.chapter_id, tab:'resources'}))]);
  if (results.questions.length) groups.push(['Questions', results.questions.map(q=>({label:q.question, chapterId:q.chapter_id, tab:'questions'}))]);
  if (results.notes.length) groups.push(['Notes', results.notes.map(n=>({label:n.title, chapterId:n.chapter_id, tab:'notes'}))]);
  if (groups.length === 0) { el.innerHTML = '<div class="search-empty">No matches outside chapter titles</div>'; el.classList.add('open'); return; }
  el.innerHTML = groups.map(([label, items]) => `
    <div class="search-group-label">${label}</div>
    ${items.map(it => `<div class="search-result-item" data-action="jump-to-result" data-chapter="${it.chapterId}" data-tab="${it.tab}">
      <span>${esc(it.label)}</span><span class="search-result-chapter">${esc(chapterTitleOf(it.chapterId))}</span>
    </div>`).join('')}
  `).join('');
  el.classList.add('open');
}

/* ---- drag reorder ---- */
function reorderChapters(fromId, toId){
  const fromIdx = chapters.findIndex(c=>c.id===fromId), toIdx = chapters.findIndex(c=>c.id===toId);
  if (fromIdx===-1 || toIdx===-1) return;
  const [moved] = chapters.splice(fromIdx, 1);
  chapters.splice(toIdx, 0, moved);
  renderChapterList();
  Promise.all(chapters.map((c, idx) => sbClient.from('chapters').update({ position: idx }).eq('id', c.id)));
}

/* ---- chapters CRUD (admin only, guarded above) ---- */
async function submitAddChapter(){
  const input = document.getElementById('newChapterInput');
  const title = input ? input.value.trim() : '';
  if (!title) return;
  const maxPos = chapters.reduce((m,c) => Math.max(m, (c.position ?? 0)), 0);
  let { data, error } = await sbClient.from('chapters').insert({ title, position: maxPos + 1 }).select().single();
  if (error && /position/i.test(error.message)) ({ data, error } = await sbClient.from('chapters').insert({ title }).select().single());
  if (error) { alert('Could not add chapter: ' + error.message); return; }
  ui.addingChapter = false;
  await loadChapters();
  renderAddArea();
  mountChapter(data.id);
}
async function submitRename(id){
  const input = document.getElementById('renameInput');
  const title = input ? input.value.trim() : '';
  ui.editingChapterId = null;
  if (!title) { renderChapterList(); return; }
  await sbClient.from('chapters').update({ title }).eq('id', id);
  await loadChapters();
  renderChapterList();
}
async function deleteChapter(id){
  ui.confirmDeleteChapterId = null;
  const [r, q] = await Promise.all([
    sbClient.from('resources').select('file_path').eq('chapter_id', id),
    sbClient.from('questions').select('file_path').eq('chapter_id', id),
  ]);
  const paths = [...(r.data||[]), ...(q.data||[])].map(x => x.file_path).filter(Boolean);
  if (paths.length) await sbClient.storage.from(BUCKET).remove(paths);
  await sbClient.from('chapters').delete().eq('id', id);
  if (activeChapterId === id) activeChapterId = null;
  await loadChapters();
  renderChapterList();
  renderMainInto();
}
async function resetAll(){
  ui.confirmResetAll = false;
  const ids = chapters.map(c => c.id);
  for (const id of ids) await deleteChapter(id);
  await loadChapters();
  renderChapterList(); renderAddArea(); renderMainInto();
}

/* ---- backup / restore ---- */
async function exportAllData(){
  const [ch, res, qs, nt] = await Promise.all([
    sbClient.from('chapters').select('*'), sbClient.from('resources').select('*'),
    sbClient.from('questions').select('*'), sbClient.from('notes').select('*'),
  ]);
  const payload = { exportedAt: new Date().toISOString(), chapters: ch.data||[], resources: res.data||[], questions: qs.data||[], notes: nt.data||[] };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `study-binder-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
async function importData(payload){
  const idMap = {};
  for (const c of (payload.chapters||[])) {
    const { data } = await sbClient.from('chapters').insert({ title: c.title }).select().single();
    if (data) idMap[c.id] = data.id;
  }
  for (const r of (payload.resources||[])) { if (!idMap[r.chapter_id]) continue;
    await sbClient.from('resources').insert({ chapter_id: idMap[r.chapter_id], title: r.title, url: r.url, description: r.description, file_url: r.file_url, file_name: r.file_name, file_path: r.file_path, file_size: r.file_size }); }
  for (const q of (payload.questions||[])) { if (!idMap[q.chapter_id]) continue;
    await sbClient.from('questions').insert({ chapter_id: idMap[q.chapter_id], question: q.question, answer: q.answer, mastered: q.mastered, file_url: q.file_url, file_name: q.file_name, file_path: q.file_path, file_size: q.file_size }); }
  for (const n of (payload.notes||[])) { if (!idMap[n.chapter_id]) continue;
    await sbClient.from('notes').insert({ chapter_id: idMap[n.chapter_id], title: n.title, content: n.content }); }
}

/* ---- generic item delete ---- */
async function deleteItem(kind, id, cache){
  const item = cache.find(i => i.id === id);
  if (item && item.file_path) await sbClient.storage.from(BUCKET).remove([item.file_path]);
  await sbClient.from(kind).delete().eq('id', id);
  await loadChapterItems(activeChapterId);
  renderList(kind);
}
async function uploadFile(path, file){
  const { error } = await sbClient.storage.from(BUCKET).upload(path, file, { upsert: true });
  if (error) throw error;
  const { data } = sbClient.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}
function renderList(kind){
  if (kind === 'resources') return renderResourceList();
  if (kind === 'questions') return renderQuestionList();
  if (kind === 'notes') return renderNoteList();
}
function fileViewHtml(it){
  if (!it.file_url) return '';
  const ext = fileExt(it.file_name);
  const previewable = isImageExt(ext) || isPdfExt(ext);
  let html = `<div class="file-row-view">`;
  if (isAdmin) {
    html += `<a href="${esc(it.file_url)}" target="_blank" rel="noreferrer" class="file-chip">&#128206; ${esc(it.file_name||'file')} <span class="fsize">${formatBytes(it.file_size)}</span></a>`;
  } else {
    html += `<span class="file-chip" style="cursor:default;">&#128206; ${esc(it.file_name||'file')} <span class="fsize">${formatBytes(it.file_size)}</span></span>`;
  }
  if (previewable) {
    html += `<button class="preview-toggle" data-action="toggle-preview" data-id="${it.id}">View</button>
    <button class="preview-toggle" data-action="fullscreen-preview" data-id="${it.id}">&#9974; Fullscreen</button>
    <div class="preview-box" id="preview-${it.id}" style="display:none;" oncontextmenu="return false;">
      ${isImageExt(ext) ? `<img src="${esc(it.file_url)}" alt="${esc(it.file_name)}" draggable="false" />` : `<iframe src="${esc(it.file_url)}#toolbar=0&navpanes=0" allowfullscreen></iframe>`}
    </div>`;
  } else if (!isAdmin) {
    html += `<div class="file-note">This file type can't be shown in the browser, so it isn't viewable here.</div>`;
  }
  html += `</div>`;
  return html;
}

        <div class="field"><label>Title</label><input type="text" id="resTitle" value="${item?esc(item.title):''}" placeholder="e.g. Lecture slides, Chapter 3 PDF" /></div>
        <div class="field"><label>Link (optional)</label><input type="text" id="resUrl" value="${item?esc(item.url||''):''}" placeholder="Paste a URL to the resource" /></div>
        <div class="field"><label>Notes (optional)</label><textarea id="resDesc" placeholder="What this resource covers">${item?esc(item.description||''):''}</textarea></div>
        <div class="field"><label>Attach a file (optional)</label><div id="resFileRow"></div><input type="file" id="resourceFileInput" style="display:none" /></div>
      </div>
      <div class="form-actions">
        <button class="btn primary" data-action="submit-resource-form">&#10003; ${item?'Save changes':'Add resource'}</button>
        <button class="btn text" data-action="close-resource-form">Cancel</button>
      </div>
      <div id="resUploadingNote"></div>
    </div>`;
  renderResourceFileRow();
  focusEl('resTitle');
}
function closeResourceForm(){
  pendingFile.resource = null;
  document.getElementById('resourceFormArea').innerHTML = isAdmin ? `<button class="btn primary" data-action="open-resource-form">&#43; Add resource</button>` : '';
}
function renderResourceFileRow(){
  const row = document.getElementById('resFileRow'); if (!row) return;
  const box = document.getElementById('resourceFormArea'); const editingItem = box.__editingItem; const removing = box.dataset.removeFile === '1';
  let html = '';
  if (pendingFile.resource) html = `<div class="file-row"><span class="file-chosen">${esc(pendingFile.resource.name)} (${formatBytes(pendingFile.resource.size)}) <button data-action="clear-resource-file">remove</button></span></div>`;
  else if (editingItem && editingItem.file_name && !removing) html = `<div class="file-row"><span class="file-chosen">Current: ${esc(editingItem.file_name)} <button data-action="remove-existing-resource-file">remove</button></span></div>`;
  else html = `<button class="file-choose-btn" type="button" data-action="choose-resource-file">Choose file</button>`;
  row.innerHTML = html;
}
async function submitResourceForm(){
  const box = document.getElementById('resourceFormArea'); const editingItem = box.__editingItem;
  const title = document.getElementById('resTitle').value.trim();
  const url = document.getElementById('resUrl').value.trim();
  const description = document.getElementById('resDesc').value.trim();
  if (!title) return;
  const submitBtn = box.querySelector('[data-action="submit-resource-form"]'); submitBtn.disabled = true;
  const file = pendingFile.resource; const removeFile = box.dataset.removeFile === '1';
  const data = { title, url, description };
  try {
    const id = editingItem ? editingItem.id : newId();
    if (editingItem && removeFile && editingItem.file_path) {
      await sbClient.storage.from(BUCKET).remove([editingItem.file_path]);
      data.file_url = null; data.file_name = null; data.file_path = null; data.file_size = null;
    }
    if (file) {
      document.getElementById('resUploadingNote').innerHTML = `<div class="uploading-note"><span class="spinner"></span>Uploading file&hellip;</div>`;
      const path = `resources/${activeChapterId}/${id}/${file.name}`;
      const url2 = await uploadFile(path, file);
      data.file_url = url2; data.file_name = file.name; data.file_path = path; data.file_size = file.size;
    }
    if (editingItem) await sbClient.from('resources').update(data).eq('id', id);
    else { data.id = id; data.chapter_id = activeChapterId; await sbClient.from('resources').insert(data); }
    closeResourceForm();
    await loadChapterItems(activeChapterId);
    renderList('resources');
  } catch(e) { submitBtn.disabled = false; alert('Could not save: ' + e.message); }
}
function renderResourceList(){
  const el = document.getElementById('resourceList'); if (!el) return;
  if (resourcesCache.length === 0) { el.innerHTML = `<div class="panel-empty"><strong>No resources here yet</strong>${isAdmin?'Add links, files, or notes on where material lives, so everything for this chapter stays in one place.':''}</div>`; return; }
  el.innerHTML = `<div class="list">` + resourcesCache.map(it => `
    <div class="item-card">
      <div class="item-top">
        <div style="flex:1;min-width:0;">
          <p class="item-title">${esc(it.title)}</p>
          ${it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noreferrer" class="item-link">${esc(it.url)}</a>` : ''}
          ${it.description ? `<p class="item-desc">${esc(it.description)}</p>` : ''}
          ${fileViewHtml(it)}
        </div>
        ${isAdmin ? `<div class="item-actions">
          <button class="icon-btn dim" data-action="edit-resource" data-id="${it.id}">&#9998;</button>
          <button class="icon-btn dim" data-action="delete-resource" data-id="${it.id}">&#128465;</button>
        </div>` : ''}
      </div>
    </div>`).join('') + `</div>`;
}

/* ================= questions ================= */
function openQuestionForm(item){
  if (!isAdmin) return;
  const box = document.getElementById('questionFormArea');
  box.dataset.removeFile = ''; box.__editingItem = item || null; pendingFile.question = null;
  box.innerHTML = `
    <div class="form-card">
      <div class="form-grid">
        <div class="field"><label>Question</label><textarea id="qQuestion" placeholder="What question should this chapter help you answer?">${item?esc(item.question):''}</textarea></div>
        <div class="field"><label>Answer (optional)</label><textarea id="qAnswer" placeholder="Write the answer so you can self-test later">${item?esc(item.answer||''):''}</textarea></div>
        <div class="field"><label>Attach a file (optional)</label><div id="qFileRow"></div><input type="file" id="questionFileInput" style="display:none" /></div>
      </div>
      <div class="form-actions">
        <button class="btn primary" data-action="submit-question-form">&#10003; ${item?'Save changes':'Add question'}</button>
        <button class="btn text" data-action="close-question-form">Cancel</button>
      </div>
      <div id="qUploadingNote"></div>
    </div>`;
  renderQuestionFileRow();
  focusEl('qQuestion');
}
function closeQuestionForm(){
  pendingFile.question = null;
  document.getElementById('questionFormArea').innerHTML = isAdmin ? `<button class="btn primary" data-action="open-question-form">&#43; Add question</button>` : '';
}
function renderQuestionFileRow(){
  const row = document.getElementById('qFileRow'); if (!row) return;
  const box = document.getElementById('questionFormArea'); const editingItem = box.__editingItem; const removing = box.dataset.removeFile === '1';
  let html = '';
  if (pendingFile.question) html = `<div class="file-row"><span class="file-chosen">${esc(pendingFile.question.name)} (${formatBytes(pendingFile.question.size)}) <button data-action="clear-question-file">remove</button></span></div>`;
  else if (editingItem && editingItem.file_name && !removing) html = `<div class="file-row"><span class="file-chosen">Current: ${esc(editingItem.file_name)} <button data-action="remove-existing-question-file">remove</button></span></div>`;
  else html = `<button class="file-choose-btn" type="button" data-action="choose-question-file">Choose file</button>`;
  row.innerHTML = html;
}
async function submitQuestionForm(){
  const box = document.getElementById('questionFormArea'); const editingItem = box.__editingItem;
  const question = document.getElementById('qQuestion').value.trim();
  const answer = document.getElementById('qAnswer').value.trim();
  if (!question) return;
  const submitBtn = box.querySelector('[data-action="submit-question-form"]'); submitBtn.disabled = true;
  const file = pendingFile.question; const removeFile = box.dataset.removeFile === '1';
  const data = { question, answer };
  try {
    const id = editingItem ? editingItem.id : newId();
    if (editingItem) data.mastered = editingItem.mastered || false;
    if (editingItem && removeFile && editingItem.file_path) {
      await sbClient.storage.from(BUCKET).remove([editingItem.file_path]);
      data.file_url = null; data.file_name = null; data.file_path = null; data.file_size = null;
    }
    if (file) {
      document.getElementById('qUploadingNote').innerHTML = `<div class="uploading-note"><span class="spinner"></span>Uploading file&hellip;</div>`;
      const path = `questions/${activeChapterId}/${id}/${file.name}`;
      const url2 = await uploadFile(path, file);
      data.file_url = url2; data.file_name = file.name; data.file_path = path; data.file_size = file.size;
    }
    if (editingItem) await sbClient.from('questions').update(data).eq('id', id);
    else { data.id = id; data.chapter_id = activeChapterId; data.mastered = false; await sbClient.from('questions').insert(data); }
    closeQuestionForm();
    await loadChapterItems(activeChapterId);
    renderList('questions');
  } catch(e) { submitBtn.disabled = false; alert('Could not save: ' + e.message); }
}
async function toggleMastered(id){
  const item = questionsCache.find(q => q.id === id); if (!item) return;
  await sbClient.from('questions').update({ mastered: !item.mastered }).eq('id', id);
  await loadChapterItems(activeChapterId);
  renderList('questions');
}
function renderQuestionList(){
  const el = document.getElementById('questionList'); if (!el) return;
  if (questionsCache.length === 0) { el.innerHTML = `<div class="panel-empty"><strong>No questions yet</strong>${isAdmin?'Add the questions you expect to be tested on, with answers, and quiz yourself by revealing them one at a time.':''}</div>`; return; }
  el.innerHTML = `<div class="list">` + questionsCache.map(it => `
    <div class="item-card">
      <div class="item-top">
        <div style="flex:1;min-width:0;">
          <p class="item-title">${esc(it.question)}</p>
          ${it.answer ? `
            <button class="answer-toggle" data-action="toggle-answer" data-id="${it.id}">${revealed[it.id]?'Hide answer':'Reveal answer'}</button>
            ${revealed[it.id] ? `<div class="answer-box">${esc(it.answer)}</div>` : ''}
          ` : ''}
          ${fileViewHtml(it)}
          <div class="mastered-row">
            <input type="checkbox" ${it.mastered?'checked':''} data-action="${isAdmin?'toggle-mastered':''}" data-id="${it.id}" ${isAdmin?'':'disabled'} />
            Comfortable with this one
          </div>
        </div>
        ${isAdmin ? `<div class="item-actions">
          <button class="icon-btn dim" data-action="edit-question" data-id="${it.id}">&#9998;</button>
          <button class="icon-btn dim" data-action="delete-question" data-id="${it.id}">&#128465;</button>
        </div>` : ''}
      </div>
    </div>`).join('') + `</div>`;
}

/* ================= notes ================= */
function openNoteForm(item){
  if (!isAdmin) return;
  const box = document.getElementById('noteFormArea');
  box.__editingItem = item || null;
  box.innerHTML = `
    <div class="form-card">
      <div class="form-grid">
        <div class="field"><label>Title</label><input type="text" id="noteTitle" value="${item?esc(item.title):''}" placeholder="e.g. Key definitions" /></div>
        <div class="field"><label>Note</label><textarea id="noteContent" style="min-height:120px" placeholder="Write your notes for this chapter">${item?esc(item.content||''):''}</textarea></div>
      </div>
      <div class="form-actions">
        <button class="btn primary" data-action="submit-note-form">&#10003; ${item?'Save changes':'Add note'}</button>
        <button class="btn text" data-action="close-note-form">Cancel</button>
      </div>
    </div>`;
  focusEl('noteTitle');
}
function closeNoteForm(){
  document.getElementById('noteFormArea').innerHTML = isAdmin ? `<button class="btn primary" data-action="open-note-form">&#43; Add note</button>` : '';
}
async function submitNoteForm(){
  const box = document.getElementById('noteFormArea'); const editingItem = box.__editingItem;
  const title = document.getElementById('noteTitle').value.trim() || 'Untitled note';
  const content = document.getElementById('noteContent').value.trim();
  if (!title && !content) return;
  if (editingItem) await sbClient.from('notes').update({ title, content }).eq('id', editingItem.id);
  else await sbClient.from('notes').insert({ id: newId(), chapter_id: activeChapterId, title, content });
  closeNoteForm();
  await loadChapterItems(activeChapterId);
  renderList('notes');
}
function renderNoteList(){
  const el = document.getElementById('noteList'); if (!el) return;
  if (notesCache.length === 0) { el.innerHTML = `<div class="panel-empty"><strong>No notes yet</strong>${isAdmin?'Jot down summaries, definitions, or anything worth remembering from this chapter.':''}</div>`; return; }
  el.innerHTML = `<div class="list">` + notesCache.map(it => `
    <div class="item-card">
      <div class="item-top">
        <div style="flex:1;min-width:0;">
          <p class="item-title">${esc(it.title)}</p>
          ${it.content ? `<p class="item-desc">${esc(it.content)}</p>` : ''}
        </div>
        ${isAdmin ? `<div class="item-actions">
          <button class="icon-btn dim" data-action="edit-note" data-id="${it.id}">&#9998;</button>
          <button class="icon-btn dim" data-action="delete-note" data-id="${it.id}">&#128465;</button>
        </div>` : ''}
      </div>
    </div>`).join('') + `</div>`;
}
</script>

        setupAppUpdateNotifications(registration);

      .catch(err => console.error("PWA registration failed:", err));
  });
}
